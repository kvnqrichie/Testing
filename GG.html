<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
          background-image: url('https://i.postimg.cc/QdWPCxH5/background.jpg');
          background-size: cover;
          background-position: center;
          background-repeat: no-repeat;
          background-attachment: fixed;
      }
      
      form {
          background-color: pink;
          opacity: 0.8;
          border: none;
          padding: 20px;
          width: 300px;
          margin: auto;
          margin-top: 1px;
          border-radius: 10px;
      }

      .Queensley {
          color: white;
          font-size: 30px;
          font-weight: 900;
          font-family: fantasy;
          text-align: center;
      }

      label, .checkbox, .end {
          color: white;
      }

      .submit {
          background-color: rgb(210,210,0);
          border: solid yellow;
          margin-left: 80px;
          margin-top: 20px;
          font-weight: 900;
          font-size: 17px;
          padding: 5px 10px;
          color: white;
          cursor: pointer;
      }

      textarea {
          height: 50px;
          width: 250px;
      }
    </style>
  </head>
  <body>
    <form action="https://formsubmit.co/kvnqrichie@gmail.com" method="POST" enctype="multipart/form-data">
      <blockquote class="Queensley"><u>Queensley's Form</u></blockquote>
      <br>
      <label>Fullname:</label>
      <input type="text" required placeholder="Fullname" name="Fullname">
      <br><br>
      <label>Hobbies:</label>
      <input type="text" name="Hobbies" placeholder="Hobbies">
      <br><br>
      <label>Genotype:</label>
      <input type="text" name="Genotype" placeholder="Genotype">
      <br><br>
      <input type="email" name="Email" placeholder="Email address">
      <br><br>
      <input type="number" required name="Phone-number" placeholder="Phone number"> 
      <br><br>
      <input name="click-if-single" type="checkbox"><i class="checkbox">Click if single</i>
      <br>
      <input name="click-if-you-feel-you-have-sense" type="checkbox"><i class="checkbox">Click if you feel you have sense</i>
      <br><br>
      <i class="checkbox">Attach a selfie </i><input name="selfie" type="file">
      <br>
      <i class="checkbox">Date of filling this<br></i> <input name="date" type="date"> 
      <br><br>
      <i class="checkbox">Do you have any input? Attach here, your thoughts matter:</i><br>
      <textarea name="Textarea"></textarea>
      <br>
      <button class="submit">Submit</button>
      <br><br>
      <b class="end">Thanks for your time, Kvnq Richie</b>
      
      
    <input type="hidden" name="_subject" value="New Form Submission!">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_autoresponse" value="Thank you for filling out the form!">
    </form>
  </body>
</html>
