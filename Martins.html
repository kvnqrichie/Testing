<! DOCTYPE html>
  <html>
  <head>
    <title>Forms</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      form {
        border: 1px solid black;
        margin: 20px;
        padding: 10px;
        border-radius: 5px;
        background: black;
      }
      form h2 {
        text-align: center;
        margin: 10px;
        color: white;
      }
      form input {
        width: 100%;
        height: 35px;
        margin: 5px 0;
        padding-left: 10px;
        outline: none;
        color: green;
        border: 1px solid green;
        border-radius: 5px;
        background: transparent;
      }
      form button {
        width: 100%;
        height: 40px;
        margin-top: 20px;
        background-color: green;
        border: none;
        border-radius: 5px;
      }
      .link1 {
        color: white;
        font-size: 10px;
        text-align: center;
        margin: 10px 0;
      }
      .link1 span a {
        color: green;
        text-decoration: none;
      }

      .number-box {
        border: 1px solid green;
      }

      .number-box div {
        height: 35px;
        border: 1px solid green;
      }


    </style>
  </head>
  <body>

    <nav>
      <p>
        
        </nav>

        <form>

          <h2>Login</h2>

          <input type="text" required placeholder="Fullname">

          <input type="email" required placeholder="Email Address">

          <input type="tel" required placeholder="Phone number">

          <input type="password" required placeholder="Password">

          <br>
          <button>SUBMIT</button>


          <p class="link1">
            I don't have an account <span><a href="https://www.google.com">Create account</a></span>
          </p>

        </form>

      </body>
    </html>
